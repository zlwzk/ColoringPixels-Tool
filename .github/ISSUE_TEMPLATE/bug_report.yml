name: Bug 反馈
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写完整，便于快速定位问题。
        提交前请先确认已查看 [README](https://github.com/zlwzk/ColoringPixelsCheat#常见问题) 与 [docs/USAGE.md](https://github.com/zlwzk/ColoringPixelsCheat/blob/main/docs/USAGE.md)。

  - type: input
    id: version
    attributes:
      label: 版本号
      description: 安装器 / 插件版本（见文件名或 Release 标签）
      placeholder: 例如 v1.0.0
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: 涉及组件
      options:
        - 安装器（ColoringPixelsCheat-Setup.exe）
        - 游戏内面板 / 插件
        - 构建脚本 / CI
        - 文档
        - 其它
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 清楚、简要地描述发生了什么
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: |
        插件日志：`<游戏目录>\BepInEx\LogOutput.log`
        安装器日志：`%TEMP%\ColoringPixelsCheat-Setup.log`
        请粘贴关键片段（可使用 ``` 包裹）。
      render: text
    validations:
      required: false

  - type: input
    id: env
    attributes:
      label: 系统 / 游戏环境
      placeholder: 例如 Windows 11 23H2，Steam 版游戏，游戏安装在 D:\Steam
    validations:
      required: false
